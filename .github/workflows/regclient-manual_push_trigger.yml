name: Manual push trigger

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_client:
    name: Build and push Registration Client
    runs-on: ubuntu-22.04

    env:
      SERVICE_NAME: registration-client
      SERVICE_LOCATION: registration
      NAMESPACE: ${{ secrets.dev_namespace_docker_hub }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          cache-dependency-path: registration/pom.xml

      - name: Determine branch and image tag
        shell: bash
        run: |
          set -euo pipefail
          BRANCH_NAME="${GITHUB_REF_NAME}"
          IMAGE_TAG=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_.-]/-/g')
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Configure Maven settings
        shell: bash
        env:
          RELEASE_USER: ${{ secrets.RELEASE_USER }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          cat > "$GITHUB_WORKSPACE/settings.xml" <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">
            <servers>
              <server>
                <id>ossrh</id>
                <username>${env.RELEASE_USER}</username>
                <password>${env.RELEASE_TOKEN}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>allow-snapshots</id>
                <repositories>
                  <repository>
                    <id>snapshots-repo</id>
                    <url>https://oss.sonatype.org/content/repositories/snapshots</url>
                    <releases><enabled>false</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                  <repository>
                    <id>central</id>
                    <url>https://repo.maven.apache.org/maven2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>allow-snapshots</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Build with Maven
        working-directory: registration
        run: |
          mvn -B package --file pom.xml \
            -s "$GITHUB_WORKSPACE/settings.xml" \
            -DskipTests -Dgpg.skip=true

      - name: Build Docker image
        working-directory: registration
        run: |
          docker build --file Dockerfile --tag "$SERVICE_NAME:$IMAGE_TAG" .

      - name: Check Docker Hub credentials
        env:
          DOCKER_USERNAME: ${{ secrets.actor_docker_hub }}
          DOCKER_PASSWORD: ${{ secrets.release_docker_hub }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DOCKER_USERNAME" || { echo "Missing actor_docker_hub secret"; exit 1; }
          test -n "$DOCKER_PASSWORD" || { echo "Missing release_docker_hub secret"; exit 1; }
          test -n "$NAMESPACE" || { echo "Missing dev_namespace_docker_hub secret"; exit 1; }

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.actor_docker_hub }}
          password: ${{ secrets.release_docker_hub }}

      - name: Tag and push Docker image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_ID=$(echo "$NAMESPACE/$SERVICE_NAME" | tr '[:upper:]' '[:lower:]')
          docker tag "$SERVICE_NAME:$IMAGE_TAG" "$IMAGE_ID:$IMAGE_TAG"
          docker push "$IMAGE_ID:$IMAGE_TAG"
          echo "Pushed image: $IMAGE_ID:$IMAGE_TAG"
